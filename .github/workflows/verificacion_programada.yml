name: Radar Contrataciones - Verificacion Programada

on:
  schedule:
    # Peru UTC-5: 08:00 y 18:00
    - cron: "0 13,23 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pytest

      - name: Preparar base SQLite temporal para CI
        run: |
          mkdir -p data
          python -c "import sqlite3; sqlite3.connect('data/radar_contrataciones.sqlite3').close()"

      - name: Ejecutar pruebas del importador
        run: |
          mkdir -p data/test-tmp-batch
          python -m pytest tests/test_pladicop.py tests/test_pladicop_batch.py -q -o cache_dir=data/test-cache-batch --basetemp=data/test-tmp-batch

      - name: Registrar ejecucion
        run: |
          echo "Verificacion completada"
          TZ=America/Lima date '+Fecha Peru: %Y-%m-%d %H:%M:%S'
