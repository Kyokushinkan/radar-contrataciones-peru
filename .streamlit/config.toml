[server]
port = 8501
headless = true
showEmailPrompt = false
enableCORS = true
enableXsrfProtection = true
enableStaticServing = false
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorLinks = "false"

[theme]
base = "light"
primaryColor = "#176B69"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F6F8"
textColor = "#172B3A"
font = "sans-serif"
